# NetOne Lead Automation — full demo stack.
# Usage: cp .env.example .env && fill values, then `docker compose up --build`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: netone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netone_demo_pw}
      POSTGRES_DB: ${POSTGRES_DB:-netone_leads}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netone} -d ${POSTGRES_DB:-netone_leads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: netone-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Service-networking overrides (container hostnames, not localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-netone}:${POSTGRES_PASSWORD:-netone_demo_pw}@postgres:5432/${POSTGRES_DB:-netone_leads}
      WHATSAPP_SERVICE_URL: http://whatsapp:3000
      BACKEND_PORT: 4000
      FIREBASE_ADMIN_CREDENTIALS: ./secrets/firebase-admin.json
    ports:
      - "4000:4000"
    volumes:
      # Firebase Admin service-account JSON (git-ignored on the host).
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp:
    build: ./whatsapp-service
    container_name: netone-whatsapp
    restart: unless-stopped
    environment:
      PORT: 3000
      SESSION_DIR: /app/session
      BACKEND_WEBHOOK_URL: http://backend:4000/api/channels/whatsapp/webhook
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      # WhatsApp/Baileys session credentials persist here across restarts.
      - ./data/whatsapp_session:/app/session
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: netone-frontend
    restart: unless-stopped
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Set DISABLE_AUTH=true to run the console without forcing Clerk sign-in.
      DISABLE_AUTH: ${DISABLE_AUTH:-}
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
